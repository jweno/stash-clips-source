name: Clips
description: Mobile-first random scene marker preview feed for Stash.
version: 0.2.0
url: https://github.com/jweno/stash-clips-source
ui:
  css:
    - clips.css
  javascript:
    - clips.js
settings:
  unmuteOnEnter:
    displayName: Unmute on entering the tab
    description: Start Clips with audio enabled when the tab opens. Browser autoplay rules may still require a tap.
    type: BOOLEAN
  historyExclusionWindow:
    displayName: Duplicate exclusion window size
    description: Number of recent clips to exclude from selection to prevent repeats (-1 for unlimited).
    type: NUMBER
